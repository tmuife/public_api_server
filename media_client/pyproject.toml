[project]
name = "media-client"
version = "0.2.0"
description = "FastAPI video preprocess/compose service with Kafka transport"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka==2.5.3",
    "cryptography==45.0.7",
    "fastapi==0.115.5",
    "httpx==0.27.2",
    "python-decouple==3.8",
    "python-multipart==0.0.12",
    "uvicorn==0.32.1",
]

[project.scripts]
media-client = "main:main"

[project]
name = "media-server"
version = "0.1.0"
description = "FastAPI async Kafka frame worker compatible with media_client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka==2.5.3",
    "cryptography==45.0.7",
    "fastapi==0.115.5",
    "httpx==0.27.2",
    "python-decouple==3.8",
    "uvicorn==0.32.1",
]

[project.scripts]
media-server = "main:main"
